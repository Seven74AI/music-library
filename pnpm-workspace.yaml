# Minutes. 10080 is 7 days. Applies to direct and transitive dependencies.
minimumReleaseAge: 10080

overrides:
  shell-quote: ">=1.11.0"

allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": true
  "@sentry/node-cpu-profiler": true
  better-sqlite3: true
  esbuild: true
  msw: true
  prisma: true
