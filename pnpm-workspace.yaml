# Minutes. 10080 is 7 days. Applies to direct and transitive dependencies.
minimumReleaseAge: 10080

overrides:
  minimatch: ">=11.0.1"
  shell-quote: ">=1.11.0"
  turbo-stream: ">=3.0.0"
  uuid: ">=11.1.1"

allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": true
  "@sentry/node-cpu-profiler": true
  better-sqlite3: true
  esbuild: true
  msw: true
  prisma: true
