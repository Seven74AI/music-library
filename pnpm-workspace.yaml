# Minutes. 10080 is 7 days. Applies to direct and transitive dependencies.
minimumReleaseAge: 10080

overrides:
  shell-quote: ">=1.11.0"
  turbo-stream: ">=3.0.0"
  uuid: ">=11.1.1"
  minimatch: ">=11.0.1"
  "@remix-run/react>react-router": ">=7.18.2"
  "@remix-run/react>react-router-dom": ">=7.18.2"

allowBuilds:
  "@prisma/engines": true
  "@sentry/cli": true
  "@sentry/node-cpu-profiler": true
  better-sqlite3: true
  esbuild: true
  msw: true
  prisma: true
