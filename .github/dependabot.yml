# Labels are omitted on purpose. A custom `labels` list replaces Dependabot's
# defaults, and any name that is not already on the repo is dropped. With no
# list, Dependabot creates and applies `dependencies` plus the ecosystem label
# (`npm`, `github-actions`, or `docker`).
#
# Version updates wait 7 days after publish. Dependabot does not apply this
# cooldown to security updates.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    versioning-strategy: increase
    # `effect` is pinned to the patched 3.22.x line via the `overrides` entry in
    # package.json (transitive dep of @prisma/config@7.10.1, which pins the
    # vulnerable 3.20.0; no newer @prisma/config stable exists, so the override is
    # the only mitigation). A bare `ignore` with no `versions` expands to `>= 0`
    # and applies to the SECURITY path too, which makes the security updater fail
    # with `all_versions_ignored`. Scope the rule to version updates only so it
    # stays off the security path.
    ignore:
      - dependency-name: "effect"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"
          - "@remix-run/*"
      testing:
        patterns:
          - "@playwright/*"
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      oxc:
        patterns:
          - "oxlint"
          - "oxfmt"
      aws:
        patterns:
          - "@aws-sdk/*"
      conform:
        patterns:
          - "@conform-to/*"
      dnd:
        patterns:
          - "@dnd-kit/*"
      sentry:
        patterns:
          - "@sentry/*"
      serwist:
        patterns:
          - "serwist"
          - "@serwist/*"
      radix:
        patterns:
          - "@radix-ui/*"
      tanstack:
        patterns:
          - "@tanstack/*"
      webauthn:
        patterns:
          - "@simplewebauthn/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"

  # Scans other/Dockerfile (FROM and COPY --from). The pinned yt-dlp release
  # URL in that file is not an image reference, so it stays a manual bump.
  - package-ecosystem: "docker"
    directory: "/other"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 20
    cooldown:
      default-days: 7
    ignore:
      # Node 24 is the pinned LTS (engines.node + CI). 25 is EOL, 26 is a
      # separate coordinated migration — don't auto-bump the runtime image.
      - dependency-name: "node"
        versions: [">=25"]
    commit-message:
      prefix: "chore"
      include: "scope"
